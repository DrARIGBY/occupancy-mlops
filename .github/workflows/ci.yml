# CI/CD (Task 3): test -> build -> smoke-test -> push, for the training pipeline image and
# the model endpoint image. Runs Scripts/ci_local.sh, the same pipeline as `make ci-local`.
# Images are pushed to GitHub Container Registry only for pushes to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OCC_TAG: ${{ github.sha }}
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: test -> build -> smoke-test -> push
        env:
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$IS_MAIN_PUSH" == "true" ]]; then
            export PUSH_REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"  # GHCR needs lower case
          fi
          bash Scripts/ci_local.sh
